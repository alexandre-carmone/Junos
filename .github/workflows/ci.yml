name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck (x86_64)
    runs-on: ubuntu-24.04
    # Both crates and the guider build warning-free: keep them so.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # Mirrors `just check` — no codegen, fast feedback.
      - name: cargo check (server)
        run: cargo check -p junos-server

      - name: cargo check (guider)
        run: cargo check -p junos-guider --features sim

      # The packages build it without the simulator.
      - name: cargo check (guider, as packaged)
        run: cargo check -p junos-guider

      - name: cargo check (web / wasm)
        run: cargo check -p junos-web --target wasm32-unknown-unknown

      - name: i18n keys (en + fr)
        run: python3 scripts/check_i18n.py

      # junos-web is wasm-only, so only the server and guider tests run here.
      - name: cargo test (server)
        run: cargo test -p junos-server

      # These two INDI tests wait on real time and can fail on a loaded
      # runner: they run alone in the next step.
      - name: cargo test (guider)
        run: >-
          cargo test -p junos-guider --
          --skip hello_watch_ping_and_reconnect
          --skip an_aux_mount_and_the_ways_a_mount_drops

      - name: cargo test (guider, timing tests alone)
        run: >-
          cargo test -p junos-guider --lib -- --exact --test-threads=1
          indi::client::tests::hello_watch_ping_and_reconnect
          indi::mount::tests::an_aux_mount_and_the_ways_a_mount_drops
